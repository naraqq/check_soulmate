; Installed by deploy.sh as /etc/supervisor/conf.d/soulmate-queue.conf
; Queue worker for AI report generation (QUEUE_CONNECTION=database).
; Placeholders: __APP_DIR__
[program:soulmate-queue]
command=php __APP_DIR__/current/backend/artisan queue:work --sleep=2 --tries=1 --timeout=300 --max-time=3600
user=www-data
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=320
redirect_stderr=true
stdout_logfile=__APP_DIR__/shared/storage/logs/queue.log
