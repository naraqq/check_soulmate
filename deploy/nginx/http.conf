# HTTP-only site, used until a certificate exists (`./deploy.sh ssl`).
# Placeholders: __SERVER_NAME__

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    include snippets/soulmate-check.conf;
}
