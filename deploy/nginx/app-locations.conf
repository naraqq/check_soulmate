# Installed by deploy.sh as /etc/nginx/snippets/soulmate-check.conf
# Placeholders: __APP_DIR__, __PHP_SOCK__

root __APP_DIR__/current/frontend/dist;
index index.html;

client_max_body_size 64k;   # questionnaire payloads are small

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;

# --- Laravel API ---------------------------------------------------------------
location /api/ {
    root __APP_DIR__/current/backend/public;
    try_files $uri /index.php?$query_string;
}

location = /up {
    root __APP_DIR__/current/backend/public;
    try_files $uri /index.php?$query_string;
}

location = /index.php {
    root __APP_DIR__/current/backend/public;
    include fastcgi_params;
    # $realpath_root resolves the "current" symlink so OPcache sees each release separately.
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_pass unix:__PHP_SOCK__;
    fastcgi_read_timeout 180s;
}

# --- Vite SPA --------------------------------------------------------------------
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Partner links are read-only capabilities, never public search pages.
location ^~ /shared/ {
    try_files /index.html =404;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}

location / {
    # Client-side routes (/check, /report/:token, …) all serve index.html.
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
}

location ~ /\.(?!well-known) {
    deny all;
}
